{{/* Renders the page collection passed as context as a linked, dated news list. */}}
<div class="news-list">
    {{ range . }}
        <article class="news-item">
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <time class="muted" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
        </article>
    {{ end }}
</div>
