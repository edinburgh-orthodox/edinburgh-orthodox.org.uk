{{/* Individual Markdown news post with publication date, optional summary, and article content. */}}
{{ define "main" }}
    <article class="wrap news-post">
        <header>
            <p><a href="{{ "/news/" | relURL }}">News</a></p>
            <h1>{{ .Title }}</h1>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
            {{ with .Description }}<p class="news-summary">{{ . }}</p>{{ end }}
        </header>

        <div class="news-content">
            {{ .Content }}
        </div>
    </article>
{{ end }}
